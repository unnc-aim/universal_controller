# NDJ Trigger Definition (Sentry)
# 设计目标:
# - 2 x 3: 左右两个 trigger 的 3 个停靠点
# - 2 x 4: 左右两个 trigger 的 4 个停靠点切换瞬间
# - 1: 遥控器滚轮配置点
#
# 规则:
# - 所有动作默认 false
# - 只有填写并设为 true 的动作才会生效

ndj_trigger_def:
  version: 1

  # 供解析器参考: 可选动作全集（说明用途，实际执行以各配置点 true 为准）
  # action_schema:
  #   autoaim: [on, off, toggle]
  #   nav_topic: [on, off, toggle]
  #   behavior_tree_topic: [on, off, toggle]
  #   friction_wheel: [on, off, toggle]
  #   feeder: [single_once, burst_on, burst_off, burst_toggle]
  #   spin_mode: [on, off, toggle]
  #   spin_control: [switch_toggle, accelerate, decelerate]

  # 左 trigger: 3 个停靠点 + 4 个切换瞬间
  left_trigger:
    dock_points:
      dock_1:
        actions:
          autoaim: {on: false, off: false, toggle: false}
          nav_topic: {on: false, off: false, toggle: false}
          behavior_tree_topic: {on: false, off: false, toggle: false}
          friction_wheel: {on: false, off: false, toggle: false}
          feeder:
            single_shot_once: false
            continuous_start: false
            continuous_stop: false
            continuous_toggle: false
          spin_mode: {on: false, off: false, toggle: false}
          spin_control:
            switch_toggle: false
            accelerate: false
            decelerate: false

      dock_2:
        actions:
          autoaim: {on: false, off: false, toggle: false}
          nav_topic: {on: false, off: false, toggle: false}
          behavior_tree_topic: {on: false, off: false, toggle: false}
          friction_wheel: {on: false, off: false, toggle: false}
          feeder:
            single_shot_once: false
            continuous_start: false
            continuous_stop: false
            continuous_toggle: false
          spin_mode: {on: false, off: false, toggle: false}
          spin_control:
            switch_toggle: false
            accelerate: false
            decelerate: false

      dock_3:
        actions:
          autoaim: {on: false, off: false, toggle: false}
          nav_topic: {on: false, off: false, toggle: false}
          behavior_tree_topic: {on: false, off: false, toggle: false}
          friction_wheel: {on: false, off: false, toggle: false}
          feeder:
            single_shot_once: false
            continuous_start: false
            continuous_stop: false
            continuous_toggle: false
          spin_mode: {on: false, off: false, toggle: false}
          spin_control:
            switch_toggle: false
            accelerate: false
            decelerate: false

    # 4 种停靠点状态切换瞬间（建议使用这四个方向）
    transitions:
      dock_1_to_dock_2:
        actions:
          autoaim: {on: false, off: false, toggle: false}
          nav_topic: {on: false, off: false, toggle: false}
          behavior_tree_topic: {on: false, off: false, toggle: false}
          friction_wheel: {on: false, off: false, toggle: false}
          feeder:
            single_shot_once: false
            continuous_start: false
            continuous_stop: false
            continuous_toggle: false
          spin_mode: {on: false, off: false, toggle: false}
          spin_control:
            switch_toggle: false
            accelerate: false
            decelerate: false

      dock_2_to_dock_3:
