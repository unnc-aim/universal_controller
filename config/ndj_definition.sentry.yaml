# NDJ Trigger Definition (Sentry)
# 规则: 动作默认 false；dock_points 仅 on/off；transitions 可 toggle
#
# 左中 + 右中 = 仅小陀螺（spin_mode），无导航 / 行为树 / 摩擦 / 供弹
#
# 左上：全自主（自瞄开 + 允许 nav_topic，便于 RViz / Nav2 发 cmd_vel；不必依赖行为树进程）。
# 左上 + 右上：全自主 — 摩擦轮常开；小陀螺由导航/cmd_vel（含 fake_vel 叠加 cmd_spin）与 BT 门控；
# 拨弹由 Hub 三重门控（full_auto + nav_fire_allowed + 自瞄有效）。此处显式关 RC spin_mode，避免从右中带出。
# 右中：不再强制 nav_topic off（否则在「左上 + 右中」时永远进不了导航仲裁；行为树关死后也无法靠 BT 兜底）。

ndj_trigger_def:
  version: 1

  left_switch:
    dock_points:
      up:
        actions:
          emergency_stop: {off: true}
          autoaim: {on: true}
          nav_topic: {on: true} # 允许 nav_topic，便于 RViz / Nav2 发 cmd_vel；不必依赖行为树进程
      mid:
        actions:
          emergency_stop: {off: true}
          autoaim: {off: true}
          nav_topic: {off: true}
          behavior_tree_topic: {off: true}
      down:
        actions:
          emergency_stop: {on: true}
          autoaim: {off: true}

    transitions: {}

  right_switch:
    dock_points:
      up:
        actions:
          nav_topic: {on: true}
          behavior_tree_topic: {on: true}
          friction_wheel: {on: true}
          feeder: {on: true}
          spin_mode: {off: true}
      mid:
        actions:
          # nav_topic: {off: true}
          behavior_tree_topic: {off: true}
          friction_wheel: {off: true}
          feeder: {off: true}
          # autoaim: {off: true}
          spin_mode: {on: true}
      down:
        actions:
          nav_topic: {off: true}
          behavior_tree_topic: {off: true}
          friction_wheel: {off: true}
          feeder: {off: true}
          spin_mode: {off: true}

    transitions:
      down_to_mid:
        actions:
          feeder_burst: {toggle: true}

  dial_up:
    threshold: 0.5
    actions:
      spin_control:
        accelerate: true

  dial_down:
    threshold: 0.5
    actions:
      spin_control:
        decelerate: true
