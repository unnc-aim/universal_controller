# Universal Controller Framework 统一配置（合并格式）
# =====================================================
# 使用 /** 让同一份参数同时作用于 hub + vtm_interpreter + ndj_interpreter

/**:
  ros__parameters:
    control_frequency: 1000
    autoaim_timeout_s: 0.2
    referee_timeout_s: 0.5

    # ========== 公共话题 ==========
    topics:
      unified_input: '/hub/rc_unified_input'
      autoaim_cmd: '/sp_vision/autoaim_command'
      referee_constraints: '/referee/parsed/common/constraints'
      referee_game_status: '/referee/common/game_status'
      auto_aim_switch: '/auto_aim_switch'
      gimbal_scan_cmd: '/gimbal_scan_cmd'

    # ========== 电机类型配置 ==========
    motor_type:
      chassis: 'LK'      # 'DJI' or 'LK'
      gimbal_pitch: 'DJI'
      gimbal_yaw: 'LK'
      fire_trigger: 'DJI'

    # ========== 控制器配置（合并 chassis/gimbal/fire） ==========
    controllers:
      chassis:
        wheel_track: 0.2746
        wheel_base: 0.2746
        ecd_zeros: [16300, 4735, 7000, 950]
        yaw_center_ecd: 18032
        topic_drive_write: '/ecat/sn2228292/app1/write'
        topic_drive_read: '/ecat/sn2228292/app1/read'
        topic_steer_write: '/ecat/sn2228292/app2/write'
        topic_steer_read: '/ecat/sn2228292/app2/read'
        topic_yaw_read: '/ecat/sn4128829/app1/read'
        spin_speed_default: 3000.0
        spin_speed_min: 800.0
        spin_speed_max: 6500.0
        spin_compensation_k: 0.00015  # 小陀螺模式下的平移相位补偿系数（解决平移倾斜问题）
        # LK 电机 PID (仅当 motor_type.chassis='LK' 时使用)
        steer_angle_pid: [0.3, 0.0, 0.0, 400.0, 50.0]
        steer_speed_pid: [2.6, 0.0, 0.0, 850.0, 80.0]
        drive_speed_pid: [0.7, 0.0, 0.0, 2000.0, 250.0]
        # 功率限制（参考 H7 power_controller 模型预测方法）
        power_limit_enabled: true
        power_limit_default: 80.0
        power_R: 0.7708
        power_K: 0.0131
        power_P0: 2.4565
        power_K_min: 0.001
        power_K_max: 0.1
        power_filter_alpha: 0.1
        # TODO
        topic_supercap_read: '/ecat/supercap/read'
        topic_supercap_write: '/ecat/supercap/write'

      gimbal:
        pitch_center_ecd: 5360
        pitch_min_deg: -25.0
        pitch_max_deg: 30.0
        mouse_sensitivity: 1.0
        topic_pitch_write: '/ecat/sn4653115/app4/write'
        topic_pitch_read: '/ecat/sn4653115/app4/read'
        topic_yaw_write: '/ecat/sn4128829/app1/write'
        topic_yaw_read: '/ecat/sn4128829/app1/read'
        topic_imu_read: '/ecat/sn4653115/app2/read'
        topic_autoaim_cmd: '/sp_vision/autoaim_command'
        autoaim_timeout_s: 0.2
        follow_navigation: true
        navigation_autoaim_takeover: true  # 行进中的云台许可；发射仍使用原有条件
        navigation_frame: gimbal_yaw
        follow_min_yaw_rate: 0.3           # rad/s，转动段目标下限
        follow_max_yaw_rate: 1.0           # rad/s
        follow_max_yaw_accel: 2.0          # rad/s^2
        follow_yaw_tolerance: 0.02        # rad，到位后减速停止
        follow_min_speed: 0.03            # m/s，低速时减缓云台转动并保持朝向
        follow_input_timeout_s: 0.2       # 导航指令与 IMU 的有效时间
        # Yaw 级联 PID
        yaw_pos_pid: [20.0, 0.0, 0.5, 50.0, 50.0]
        yaw_spd_pid: [220.0, 0.3, 4600.0, 2048.0, 200.0]

      fire:
        enabled: true
        friction_speed_default: 6500.0
        shot_period_ms: 50.0
        load_current_threshold: 500
        load_speed_ecd: 2.5
        topic_fire_write: '/ecat/sn4653115/app3/write'
        topic_fire_read: '/ecat/sn4653115/app3/read'
        referee_timeout_s: 0.5
        # 拨盘串级 PID
        trigger_pos_pid: [0.4, 0.0, 7.0, 13000.0, 1500.0]
        trigger_spd_pid: [5.0, 0.01, 0.0, 10000.0, 1000.0]

    # ========== RC Interpreter 配置（并入同一参数树） ==========
    rc_interpreter:
      topic_vtm_rc: '/ecat/sn4653115/vt13/read'
      topic_ndj_rc: '/ecat/sn4653115/app1/read'
      topic_vtm_output: '/universal_controller/input/vtm'
      topic_ndj_output: '/universal_controller/input/ndj'
      connection_timeout_s: 0.5
      priority: ['vtm', 'ndj']  # 当多个同时在线时优先使用哪个 RC 的输入。优先级高者摇杆如果在死区会被视为无输入，优先级低者会生效。
      analog_zero_epsilon: 1.0e-6

      joystick_max_output: 8000.0
      joystick_deadzone: 0.05

      keyboard_speed_default: 3000.0
      keyboard_speed_min: 0.0
      keyboard_speed_max: 8000.0
      keyboard_speed_step: 6.0

      spin_speed_default: 3000.0
      spin_speed_min: 800.0
      spin_speed_max: 6500.0
      spin_dial_gain: 1.0
      spin_key_gain: 2.4
      spin_dial_deadzone: 0.05

      mouse_sensitivity: 1.0
      mouse_yaw_gain: 0.75
      mouse_pitch_gain: 1.0
      mouse_limit: 100.0

      pitch_min_deg: -25.0
      pitch_max_deg: 40.0

    # ========== RC Hub 配置（遥控融合节点） ==========
    rc_hub:
      topic_vtm_input: '/universal_controller/input/vtm'
      topic_ndj_input: '/universal_controller/input/ndj'
      topic_unified_output: '/hub/rc_unified_input'
      connection_timeout_s: 0.5
      priority: ['vtm', 'ndj']
      analog_zero_epsilon: 1.0e-6
      publish_frequency: 200
